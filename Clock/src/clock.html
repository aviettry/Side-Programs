<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background">
        <div id="sun"></div>
        <div id="moon"></div>
        <!-- Stars will be dynamically added via JavaScript -->
    </div>
    <div id="time-container">
        <div id="clock"></div>
        <div id="date-header">月 - 日 - 年</div>
        <div id="date"></div>
        <div id="day"></div>
    </div>
    <button id="debug-button">DEBUG</button>
    <script src="script.js"></script>
</body>
</html>
